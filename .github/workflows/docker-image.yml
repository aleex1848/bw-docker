name: bw-cli image

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: bw-cli-image
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Neueste CLI-Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/bitwarden/clients/releases?per_page=40" \
            | jq -r '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^cli-v[0-9]")))] | sort_by(.published_at) | reverse | .[0].tag_name | sub("^cli-v"; "")')
          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Keine CLI-Version gefunden" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            echo "v$VER existiert bereits"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VER ist neu"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - name: Keepalive
        run: |
          set -euo pipefail
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "letzter Commit: vor ${age} Tagen"
          if [ "$age" -lt 45 ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive nach ${age} Tagen ohne Commit"
          git push

      - name: Image bauen und nach ghcr.io schieben
        if: steps.ver.outputs.build == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --build-arg "BW_VERSION=$VERSION" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: GitHub Release
        if: steps.ver.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --title "bw-cli $VERSION" \
            --notes "$(printf '%s\n' \
              "Image: \`$IMAGE:$VERSION\`" \
              "" \
              "Upstream: https://github.com/bitwarden/clients/releases/tag/cli-v$VERSION")"
